<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwriting Beautifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex items-center justify-center min-h-screen p-5">
        <div class="w-full max-w-4xl bg-white p-8 rounded-lg shadow-xl">
            <h1 class="text-3xl font-semibold text-center mb-6">Live Handwriting Beautifier</h1>

            <!-- Handwriting Canvas Section -->
            <div class="flex justify-between">
                <div class="w-2/3 border border-gray-300 rounded-lg">
                    <canvas id="handwritingCanvas" width="600" height="400" class="w-full h-full"></canvas>
                </div>
                <div class="w-1/3 pl-5">
                    <h2 class="text-xl font-medium">Beautified Text</h2>
                    <div id="beautifiedText" class="bg-gray-100 p-4 rounded-lg shadow-inner h-full overflow-auto mt-4 text-lg text-gray-700"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.0/dist/tesseract.min.js"></script>
    <script src="main.js"></script>

    <button onclick="clearCanvas()" class="mt-4 px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-700 transition duration-200">
      Clear Canvas
  </button>
  
</body>
</html>
